name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m research.render_report --check
      - run: python -m pip wheel --no-deps . -w "${RUNNER_TEMP}/pyjev-wheels"
      - name: Install wheel and replay outside checkout
        run: |
          python -m pip install --no-index --no-deps "${RUNNER_TEMP}"/pyjev-wheels/*.whl
          cd "${RUNNER_TEMP}"
          pyjev doctor --json
          python -m pyjev bench --json
          pyjev compare --json
