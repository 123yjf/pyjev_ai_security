[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjev-ai-security"
version = "0.1.0"
description = "A local post-response research auditor for prompt-injection signals and Chinese speech acts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "123yjf"}]
keywords = ["ai-safety", "prompt-injection", "speech-acts", "audit", "chinese"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering"]
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
pyjev = "pyjev.cli:main"
pyjev_v1 = "pyjev_v1.__main__:main"

[project.urls]
Homepage = "https://github.com/123yjf/pyjev_ai_security"
Documentation = "https://github.com/123yjf/pyjev_ai_security/blob/main/docs/start-local.md"
Source = "https://github.com/123yjf/pyjev_ai_security"
Issues = "https://github.com/123yjf/pyjev_ai_security/issues"

[tool.setuptools]
packages = ["pyjev", "pyjev_v1"]
[tool.setuptools.package-data]
pyjev = [
  "py.typed",
  "data/rulebook.json",
  "data/head.json",
  "data/results.json",
  "data/pybot-comparison.json",
  "data/pybot-raw-control.json",
]
