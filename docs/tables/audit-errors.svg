<svg xmlns="http://www.w3.org/2000/svg" width="800" height="343" viewBox="0 0 800 343" role="img" aria-labelledby="title desc">
<title id="title">Table 1. Missed injections and false alarms</title><desc id="desc">The two rightmost columns count errors. Lower is better. Test material / Error type / Texts / pyjev_v1 / HikmaAI: Injected tool responses, Miss, 450, 413, 71; Clean web templates, False alarm, 15, 0, 14; Ordinary tool tasks, False alarm, 401, 4, 36; Instruction discussions, False alarm, 27, 16, 19; Quoted instructions, False alarm, 21, 10, 5. Example: of 450 injected responses, pyjev_v1 missed 413; HikmaAI missed 71.</desc>
